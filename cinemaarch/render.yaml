# Цей файл дозволяє Render автоматично налаштувати все одразу,
# коли ви підключите GitHub-репозиторій (Render сам його знайде).
# Замініть "cinemaarch" на назву вашої папки з settings.py, якщо вона інша.

services:
  - type: web
    name: cinemaarch
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn cinemaarch.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cinemaarch-db
          property: connectionString

databases:
  - name: cinemaarch-db
    plan: free
